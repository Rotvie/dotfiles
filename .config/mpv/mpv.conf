script-opts=ytdl_hook-ytdl_path=/opt/homebrew/bin/yt-dlp
# Subtitle font: Kaiti SC (Chinese brush style, ships with macOS). Kanji like 直 骨 角 use Chinese glyph forms.
sub-font = "Kaiti SC"
# State in ~/.config/mpv/watch_later (gitignored).
save-position-on-quit = yes

screenshot-directory = ~/Downloads
# Quoted: a leading % is mpv's own quoting syntax and the option gets dropped.
screenshot-template = "%F-%wH.%wM.%wS"
screenshot-format = png
